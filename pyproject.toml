[build-system]
requires = ["setuptools >=77", "numpy >=2.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pinker"
dynamic = ["version"]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "Python inverse kinematics for embedded robots"
authors = [
    {name = "Stéphane Caron", email = "stephane.caron@normalesup.org"},
]
maintainers = [
    {name = "Stéphane Caron", email = "stephane.caron@normalesup.org"},
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Robot Framework :: Library",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy >=1.19.0",
    "qpsolvers >=4.3.1",
    "typing-extensions",
]
keywords = ["inverse", "kinematics", "pink"]

[project.urls]
Homepage = "https://pink-kinematics.github.io/pinker/"
Documentation = "https://pink-kinematics.github.io/pinker/"
Source = "https://github.com/pink-kinematics/pinker"
Tracker = "https://github.com/pink-kinematics/pinker/issues"
Changelog = "https://github.com/pink-kinematics/pinker/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "pinker.__version__"}

[tool.setuptools]
packages = [
    "pinker",
    "pinker.barriers",
    "pinker.kinematics",
    "pinker.limits",
    "pinker.tasks",
]

[tool.mypy]
ignore_missing_imports = true

# The kinematics backend is not type-checked yet
[[tool.mypy.overrides]]
module = "pinker.kinematics.*"
ignore_errors = true

[tool.pylint]
disable = [
    "C0103",  # Variable name doesn't conform to snake_case naming style
    "R0801",  # Similar lines in 2 files
    "R0902",  # Too many instance attributes
    "R0903",  # Too few public methods
    "R0913",  # Too many arguments
    "R0914",  # Too many local variables
    "R0917",  # Too many positional arguments
]
extension-pkg-allow-list = ["pinker.kinematics._kinematics_c"]
ignored-modules = [
    # Optional imports, not installed in the linting environment
    "robot_descriptions",
    "trimesh",
    "viser",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.10"
c-compiler = "*"
numpy = ">=1.19.0"
pip = "*"
qpsolvers = ">=4.3.1"
setuptools = ">=77"
typing-extensions = "*"

[tool.pixi.tasks]
# Tasks that depend on this one name their own environment explicitly, as pixi
# would otherwise install the editable package in the default environment.
build = "pip install --no-build-isolation --no-deps --force-reinstall -e ."

[tool.pixi.feature.coverage.dependencies]
coverage = ">=7.0.0"
coveralls = ">=4.0.0"
daqp = "*"
osqp = "*"
pinocchio = "==4.1.0"  # cross-validation of the kinematics backend
proxsuite = "*"
quadprog = "*"
rich = "<15"  # viser >=1.0 requires rich <15
robot_descriptions = ">=3.1.0"
scs = "*"
xacrodoc = "*"

[tool.pixi.feature.coverage.tasks]
_coverage-erase = { cmd = "coverage erase" }
_coverage-kinematics = { cmd = "coverage run -a -m unittest discover --failfast --start-directory tests/kinematics --top-level-directory tests/kinematics", depends-on = ["_coverage-erase", { task = "build", environment = "coverage" }] }
_coverage-python = { cmd = "coverage run -a -m unittest discover --failfast", depends-on = ["_coverage-erase", { task = "build", environment = "coverage" }] }
_coverage-html = { cmd = "coverage html --include=\"pinker/*\"", depends-on = ["_coverage-python", "_coverage-kinematics"] }
_coveralls = { cmd = "coveralls --service=github" }
_coverage-run = { cmd = "coverage report --include=\"pinker/*\"", depends-on = ["_coverage-python", "_coverage-kinematics"] }
coverage = { cmd = "xdg-open htmlcov/index.html", depends-on = ["_coverage-html"] }

[tool.pixi.feature.dev.dependencies]
mypy = ">=0.812"
pylint = ">=2.8.2"
ruff = ">=0.4.3"

# The PyPI wheel is a self-contained 2 MB binary, whereas the conda-forge
# package pulls in the whole of libclang-cpp. The version is pinned exactly
# because clang-format output changes between releases.
[tool.pixi.feature.dev.pypi-dependencies]
clang-format = "==23.1.1"

[tool.pixi.feature.dev.tasks]
_format-c = "clang-format -i pinker/kinematics/_kinematics_c.c"
_format-python = "ruff format pinker"
_lint-c = "clang-format --dry-run --Werror pinker/kinematics/_kinematics_c.c"
_lint-mypy = "mypy pinker --ignore-missing-imports"
_lint-pylint = "pylint pinker --exit-zero --rcfile=pyproject.toml"
_lint-ruff = "ruff check pinker && ruff format --check pinker"
format = { depends-on = ["_format-c", "_format-python"] }
lint = { depends-on = ["_lint-c", "_lint-mypy", "_lint-pylint", "_lint-ruff"] }

[tool.pixi.feature.dist.dependencies]
python-build = "*"
twine = "*"

[tool.pixi.feature.dist.tasks]
_dist-clean = "rm -rf build dist pinker.egg-info"
dist-build = { cmd = "python -m build --sdist", depends-on = ["_dist-clean"] }
dist-check = { cmd = "twine check dist/*.tar.gz", depends-on = ["dist-build"] }

[tool.pixi.feature.dist.tasks.dist-upload]
args = ["repository", "version"]
depends-on = ["dist-check"]
cmd = "twine upload --repository {{ repository }} dist/pinker-{{ version }}.tar.gz"

[tool.pixi.feature.docs.dependencies]
sphinx = ">=8.0.0"
sphinx-autodoc-typehints = "*"

[tool.pixi.feature.docs.pypi-dependencies]
sphinx-material = "*"
sphinx-mathjax-offline = "*"

[tool.pixi.feature.docs.tasks]
docs-build = { cmd = "sphinx-build docs/ docs/_build -W", depends-on = [{ task = "build", environment = "docs" }] }
docs-open = { cmd = "xdg-open docs/_build/index.html", depends-on = ["docs-build"] }

[tool.pixi.feature.examples.dependencies]
loop-rate-limiters = ">=1.2.0"
matplotlib = "*"
pycollada = "*"
rich = "<15"  # viser >=1.0 requires rich <15
robot_descriptions = ">=3.1.0"
xacrodoc = "*"

[tool.pixi.feature.examples.pypi-dependencies]
viser = ">=1.0.0"

[tool.pixi.feature.examples.tasks.example]
args = ["script"]
cmd = "python {{ script }}"
depends-on = [{ task = "build", environment = "examples" }]

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.test.dependencies]
daqp = "*"
osqp = "*"
pinocchio = "==4.1.0"  # cross-validation of the kinematics backend
proxsuite = "*"
quadprog = "*"
rich = "<15"  # viser >=1.0 requires rich <15
robot_descriptions = ">=3.1.0"
scs = "*"
xacrodoc = "*"

[tool.pixi.feature.test.tasks]
_test-kinematics = { cmd = "python -m unittest discover --failfast --start-directory tests/kinematics --top-level-directory tests/kinematics", depends-on = ["build"] }
_test-python = { cmd = "python -m unittest discover --failfast", depends-on = ["build"] }
test = { depends-on = ["_test-kinematics", "_test-python"] }

[tool.pixi.environments]
coverage = { features = ["py312", "coverage"], solve-group = "py312" }
dev = { features = ["py312", "dev"], solve-group = "py312" }
dist = { features = ["py312", "dist"], solve-group = "py312" }
docs = { features = ["py312", "docs"], solve-group = "py312" }
examples = { features = ["py312", "test", "examples"], solve-group = "py312" }
test-py310 = { features = ["py310", "test"], solve-group = "py310" }
test-py311 = { features = ["py311", "test"], solve-group = "py311" }
test-py312 = { features = ["py312", "test"], solve-group = "py312" }
test-py313 = { features = ["py313", "test"], solve-group = "py313" }
test-py314 = { features = ["py314", "test"], solve-group = "py314" }

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    # pyflakes
    "F",
    # pycodestyle
    "E",
    "W",
    # isort
    "I001",
    # pydocstyle
    "D"
]
ignore = [
    "D401",  # good for methods but not for class docstrings
    "D405",  # British-style section names are also "proper"!
]

[tool.ruff.lint.pydocstyle]
convention = "google"
